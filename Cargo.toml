[package]
name = "doorman"
version = "0.1.10"
edition = "2021"
description = "An HTTP proxy that holds your API keys and refuses to send them anywhere they don't belong."
license = "MIT"

[[bin]]
name = "doormand"
path = "src/main.rs"

# The spec lists tokio/hyper/rustls/serde/serde_yaml as the dependencies. The
# rest are unavoidable bridges (tokio-rustls, hyper-util, http-body,
# http-body-util) or implementations of features the spec demands
# (webpki-roots for upstream trust, serde_json for the audit log, time for
# RFC3339). No reqwest, no async-trait gymnastics, no plugin loader.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "signal", "sync", "time"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body = "1"
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "0.26"
# Already pulled in transitively by rustls; declared here because the pin
# verifier and the `fingerprint` subcommand call `ring::digest::SHA256`
# directly.
ring = "0.17"
serde = { version = "1", features = ["derive"] }
# serde_yaml itself was archived by its maintainer in 2024 (RUSTSEC-2024-0320)
# and its own unsafe-libyaml dependency is unmaintained too (RUSTSEC-2024-0321).
# serde_norway is an actively maintained fork with the same API that also
# forked unsafe-libyaml (as unsafe-libyaml-norway), closing both advisories
# instead of just the first — aliased to the original crate name so the rest
# of the codebase is unchanged.
serde_yaml = { package = "serde_norway", version = "0.9" }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
libc = "0.2"

[dev-dependencies]
# Used only by tests/integration.rs to mint a CA + leaf cert for the mock
# upstream. Not pulled into the release binary.
rcgen = { version = "0.13", features = ["x509-parser"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
