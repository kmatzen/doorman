[package]
name = "doorman"
version = "0.1.0"
edition = "2021"
description = "An HTTPS proxy that holds your API keys and refuses to send them anywhere they don't belong."
license = "MIT"

[[bin]]
name = "doormand"
path = "src/main.rs"

# The spec lists tokio/hyper/rustls/serde/serde_yaml as the dependencies. The
# remaining entries are unavoidable bridges between those (tokio-rustls,
# hyper-util, http-body-util) or implementations of features the spec
# explicitly demands (rcgen for on-the-fly leaf cert minting, serde_json for
# the audit log, time for RFC3339 timestamps). No reqwest, no async-trait
# gymnastics, no plugin loader.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "signal", "sync", "time"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body = "1"
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
rcgen = { version = "0.13", features = ["x509-parser"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
